<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Peminjaman Buku</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f2f5; }
        .container { max-width: 420px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
        h2 { margin-top: 0; color: #1f2937; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 11px; margin-bottom: 18px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .success { background: #d4edda; color: #155724; padding: 15px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #c3e6cb; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Peminjaman Buku</h2>

    <div id="result" class="success hidden"></div>

    <form id="daftarForm">
        <label for="nama">Nama Pengunjung:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

        <label for="no_hp">Nomor HP:</label>
        <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 081234567890" required>

        <label for="institusi">Sekolah / Institusi:</label>
        <input type="text" id="institusi" name="institusi" placeholder="Nama sekolah/kampus/kantor" required>

        <button type="submit">Daftar &amp; Pinjam</button>
    </form>
</div>

<script>
    document.getElementById('daftarForm').addEventListener('submit', function (e) {
        e.preventDefault();

        function esc(str) {
            return str.replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        var nama = esc(document.getElementById('nama').value);
        var no_hp = esc(document.getElementById('no_hp').value);
        var institusi = esc(document.getElementById('institusi').value);

        var result = document.getElementById('result');
        result.innerHTML = '<strong>Pendaftaran Berhasil!</strong><br><br>' +
            'Nama: ' + nama + '<br>' +
            'No. HP: ' + no_hp + '<br>' +
            'Sekolah/Institusi: ' + institusi;
        result.classList.remove('hidden');

        this.reset();
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
</script>

</body>
</html>
